<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pokédex social cover</title>
    <style>
      :root {
        --red: #ef4444;
        --red-dark: #b91c1c;
        --navy: #0f172a;
        --navy-soft: #1e293b;
        --panel: rgba(15, 23, 42, 0.78);
        --ink: #e2e8f0;
        --muted: #94a3b8;
        --line: rgba(226, 232, 240, 0.1);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        font-family: Inter, "Segoe UI", system-ui, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 12% 20%, rgba(239, 68, 68, 0.34), transparent 24%),
          radial-gradient(circle at 86% 16%, rgba(248, 113, 113, 0.22), transparent 18%),
          linear-gradient(135deg, #111827 0%, #0f172a 38%, #1e293b 100%);
      }

      .frame {
        position: relative;
        width: 100%;
        height: 100%;
        padding: 44px;
      }

      .frame::before {
        content: "";
        position: absolute;
        inset: 22px;
        border: 1px solid rgba(226, 232, 240, 0.08);
        border-radius: 28px;
      }

      .pokeball {
        position: absolute;
        width: 230px;
        height: 230px;
        border-radius: 50%;
        border: 12px solid rgba(226, 232, 240, 0.08);
        opacity: 0.9;
      }

      .pokeball::before,
      .pokeball::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
      }

      .pokeball::before {
        top: 0;
        height: 50%;
        background: linear-gradient(180deg, rgba(239, 68, 68, 0.75), rgba(185, 28, 28, 0.7));
        border-radius: 999px 999px 0 0;
      }

      .pokeball::after {
        top: calc(50% - 5px);
        height: 10px;
        background: rgba(226, 232, 240, 0.16);
      }

      .pokeball__button {
        position: absolute;
        inset: 50%;
        width: 62px;
        height: 62px;
        margin: -31px;
        border-radius: 50%;
        border: 10px solid rgba(226, 232, 240, 0.16);
        background: rgba(248, 250, 252, 0.86);
      }

      .pokeball--left {
        top: -36px;
        left: -14px;
        transform: rotate(-14deg);
      }

      .pokeball--right {
        right: 38px;
        bottom: 34px;
        width: 168px;
        height: 168px;
        transform: rotate(18deg);
        opacity: 0.7;
      }

      .hud {
        position: absolute;
        top: 58px;
        right: 62px;
        display: grid;
        gap: 12px;
      }

      .hud__row {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
      }

      .hud__pill {
        width: 56px;
        height: 10px;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.18);
      }

      .layout {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: 1.08fr 0.92fr;
        gap: 26px;
        width: 100%;
        height: 100%;
        align-items: stretch;
      }

      .hero {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .hero__panel {
        width: 630px;
        max-width: 100%;
        min-height: 542px;
        border-radius: 32px;
        padding: 56px 54px;
        background:
          linear-gradient(180deg, rgba(239, 68, 68, 0.16), rgba(239, 68, 68, 0.04)),
          var(--panel);
        border: 1px solid var(--line);
        box-shadow: 0 30px 90px rgba(15, 23, 42, 0.42);
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .eyebrow {
        margin: 0 0 18px;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #fda4af;
      }

      h1 {
        margin: 0;
        font-size: 78px;
        line-height: 0.95;
        letter-spacing: -0.04em;
      }

      .tagline {
        margin: 22px 0 0;
        font-size: 29px;
        line-height: 1.2;
        color: #f8fafc;
      }

      .stack {
        margin: 26px 0 0;
        font-size: 18px;
        line-height: 1.5;
        color: var(--muted);
      }

      .stack strong {
        color: #fecaca;
        font-weight: 700;
      }

      .ui {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .console {
        width: 100%;
        max-width: 442px;
        border-radius: 28px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.02)),
          rgba(15, 23, 42, 0.68);
        border: 1px solid var(--line);
        box-shadow: 0 22px 70px rgba(15, 23, 42, 0.34);
        overflow: hidden;
      }

      .console__top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 22px 14px;
      }

      .console__lights {
        display: flex;
        gap: 8px;
      }

      .console__light {
        width: 12px;
        height: 12px;
        border-radius: 999px;
        background: rgba(248, 250, 252, 0.3);
      }

      .console__light--red {
        background: #fb7185;
      }

      .console__light--amber {
        background: #f59e0b;
      }

      .console__light--green {
        background: #34d399;
      }

      .console__title {
        font-size: 14px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .console__body {
        padding: 0 22px 22px;
        display: grid;
        gap: 14px;
      }

      .search {
        border-radius: 18px;
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid rgba(148, 163, 184, 0.18);
        padding: 14px 16px;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .search__icon {
        width: 12px;
        height: 12px;
        border-radius: 999px;
        background: rgba(248, 250, 252, 0.86);
        box-shadow: 14px 14px 0 -4px rgba(248, 250, 252, 0.86);
        transform: rotate(-38deg);
      }

      .search__text {
        color: var(--muted);
        font-size: 15px;
      }

      .chips {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .chip {
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 700;
        color: #0f172a;
      }

      .chip--fire { background: #fb7185; }
      .chip--electric { background: #facc15; }
      .chip--water { background: #60a5fa; }

      .cards {
        display: grid;
        gap: 12px;
      }

      .card {
        border-radius: 22px;
        padding: 16px 18px;
        border: 1px solid rgba(148, 163, 184, 0.14);
        background: rgba(15, 23, 42, 0.72);
        display: grid;
        grid-template-columns: 70px 1fr auto;
        align-items: center;
        gap: 14px;
      }

      .card__sprite {
        width: 70px;
        height: 70px;
        border-radius: 18px;
        background:
          radial-gradient(circle at 34% 32%, rgba(251, 191, 36, 0.96), transparent 28%),
          radial-gradient(circle at 62% 62%, rgba(239, 68, 68, 0.8), transparent 36%),
          rgba(248, 250, 252, 0.94);
      }

      .card__name {
        font-size: 20px;
        font-weight: 700;
        color: #f8fafc;
      }

      .card__meta {
        margin-top: 4px;
        font-size: 13px;
        color: var(--muted);
      }

      .card__badge {
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(239, 68, 68, 0.18);
        color: #fecaca;
        font-size: 13px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="pokeball pokeball--left"><div class="pokeball__button"></div></div>
      <div class="pokeball pokeball--right"><div class="pokeball__button"></div></div>

      <div class="hud">
        <div class="hud__row">
          <div class="hud__pill"></div>
          <div class="hud__pill" style="width: 86px;"></div>
        </div>
        <div class="hud__row">
          <div class="hud__pill" style="width: 40px;"></div>
          <div class="hud__pill" style="width: 72px;"></div>
          <div class="hud__pill" style="width: 28px;"></div>
        </div>
      </div>

      <div class="layout">
        <section class="hero">
          <div class="hero__panel">
            <p class="eyebrow">Browser-first app</p>
            <h1>Pokédex</h1>
            <p class="tagline">Search Pokémon, types and evolutions.</p>
            <p class="stack"><strong>React</strong> • <strong>TypeScript</strong> • TanStack Query • Zustand • PWA</p>
          </div>
        </section>

        <section class="ui">
          <div class="console">
            <div class="console__top">
              <div class="console__lights">
                <span class="console__light console__light--red"></span>
                <span class="console__light console__light--amber"></span>
                <span class="console__light console__light--green"></span>
              </div>
              <span class="console__title">Live browser UI</span>
            </div>
            <div class="console__body">
              <div class="search">
                <span class="search__icon"></span>
                <span class="search__text">Search by name or ID...</span>
              </div>
              <div class="chips">
                <span class="chip chip--fire">Fire</span>
                <span class="chip chip--electric">Electric</span>
                <span class="chip chip--water">Water</span>
              </div>
              <div class="cards">
                <div class="card">
                  <div class="card__sprite"></div>
                  <div>
                    <div class="card__name">Pikachu</div>
                    <div class="card__meta">#025 · Electric · Favorite</div>
                  </div>
                  <div class="card__badge">Details</div>
                </div>
                <div class="card">
                  <div class="card__sprite" style="background:
                    radial-gradient(circle at 34% 32%, rgba(96, 165, 250, 0.96), transparent 28%),
                    radial-gradient(circle at 62% 62%, rgba(14, 165, 233, 0.84), transparent 36%),
                    rgba(248, 250, 252, 0.94);"></div>
                  <div>
                    <div class="card__name">Squirtle</div>
                    <div class="card__meta">#007 · Water · Evolution chain</div>
                  </div>
                  <div class="card__badge" style="background: rgba(59, 130, 246, 0.18); color: #bfdbfe;">Browse</div>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>
  </body>
</html>
