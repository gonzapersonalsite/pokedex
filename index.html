<!doctype html>
<html lang="en">
  <head>
    <!-- Charset y Viewport -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />

    <!-- Core App Tags -->
    <title>Pokédex</title>

    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="Modern Pokédex built with React, TypeScript and Vite: search Pokémon by name or ID, filter by type, browse evolutions and keep favorites locally in your browser."
    />
    <meta name="keywords" content="Pokédex, Pokémon, React, portfolio, Gonzalo Martínez García" />
    <meta name="author" content="Gonzalo Martínez García" />
    <meta name="copyright" content="© 2026 Gonzalo Martínez García. All rights reserved." />

    <!-- Social preview: the build writes the absolute site addresses from tooling/agent-files/site.ts.
       The values here only serve the dev server. Image paths are root-relative. -->
    <meta property="og:title" content="Pokédex" />
    <meta
      property="og:description"
      content="Modern Pokédex built with React, TypeScript and Vite: search Pokémon by name or ID, filter by type, browse evolutions and keep favorites locally in your browser."
    />
    <meta property="og:url" content="/" />
    <meta property="og:site_name" content="Pokédex" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="/og-cover.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Pokédex: the app name, the tagline “Search Pokémon, types and evolutions” and its stack, React, TypeScript, TanStack Query, Zustand and PWA, over a red and dark interface inspired by a Pokédex."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pokédex" />
    <meta
      name="twitter:description"
      content="Modern Pokédex built with React, TypeScript and Vite: search Pokémon by name or ID, filter by type, browse evolutions and keep favorites locally in your browser."
    />
    <meta name="twitter:image" content="/og-cover.png" />
    <meta
      name="twitter:image:alt"
      content="Pokédex: the app name, the tagline “Search Pokémon, types and evolutions” and its stack, React, TypeScript, TanStack Query, Zustand and PWA, over a red and dark interface inspired by a Pokédex."
    />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts & API Preconnect -->
    <link rel="preconnect" href="https://pokeapi.co" crossorigin />
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/pokemon/1.webp"
      imagesrcset="/pokemon/1-256.webp 256w, /pokemon/1.webp 475w"
      imagesizes="(min-width: 1280px) 256px, (min-width: 640px) 280px, calc(100vw - 68px)"
      fetchpriority="high"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      id="app-fonts"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=optional"
      rel="stylesheet"
      media="print"
    />
    <!-- Theme and non-blocking fonts: paint the saved or system theme before the app loads so dark
         visitors never see a white screen and .app-startup is visible from the first frame
         (PokedexPage.test.ts runs this script). -->
    <script>
      ;(function () {
        var theme = null
        try {
          var stored = localStorage.getItem('pokedex-theme')
          if (stored === 'light' || stored === 'dark') {
            theme = stored
          }
        } catch (blocked) {
          // Site data is blocked: follow the system.
        }
        if (theme === null) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.setAttribute('data-theme', theme)
        document.documentElement.classList.toggle('dark', theme === 'dark')
        document.documentElement.style.colorScheme = theme
        var fonts = document.getElementById('app-fonts')
        if (fonts) {
          if (fonts.sheet) {
            fonts.media = 'all'
          } else {
            fonts.addEventListener('load', function () {
              fonts.media = 'all'
            })
          }
        }
      })()
    </script>
    <!-- Available before the app CSS/JS. Scoped to the initial shell and temporary root content that React replaces. -->
    <style>
      html {
        color-scheme: light;
        background-color: #f1f5f9;
        color: #0f172a;
      }
      html.dark {
        color-scheme: dark;
        background-color: #020617;
        color: #f1f5f9;
      }
      body {
        margin: 0;
      }
      .app-startup {
        box-sizing: border-box;
        min-height: 100svh;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 1.5rem;
        padding: 2rem 1rem;
        color: inherit;
        font:
          1rem/1.5 system-ui,
          sans-serif;
        text-align: center;
      }
      .app-startup-brand {
        margin: 0;
        font-size: 1.125rem;
        font-weight: 750;
        letter-spacing: 0.08em;
      }
      .app-startup progress {
        appearance: none;
        box-sizing: border-box;
        width: 2rem;
        height: 2rem;
        border: 3px solid color-mix(in srgb, currentColor 20%, transparent);
        border-top-color: #ef4444;
        border-radius: 50%;
        background: transparent;
        color: inherit;
      }
      .app-startup progress::-webkit-progress-bar {
        display: none;
      }
      .app-startup progress::-webkit-progress-value {
        display: none;
      }
      .app-startup progress::-moz-progress-bar {
        display: none;
      }
      @keyframes startup-spin {
        to {
          transform: rotate(1turn);
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        .app-startup progress {
          animation: startup-spin 1s linear infinite;
        }
      }
      @media print {
        .app-startup progress {
          display: none;
        }
      }
    </style>
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=optional"
        rel="stylesheet"
      />
      <style>
        .app-startup {
          display: none;
        }
      </style>
    </noscript>
  </head>

  <body>
    <div id="root">
      <main class="app-startup">
        <p class="app-startup-brand">Pokédex</p>
        <progress aria-label="Loading Pokédex"></progress>
      </main>
    </div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
